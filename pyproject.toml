[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxus"
version = "0.6.0"
description = "Generic, plugin-based ETL & data sync engine."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
fluxus = "fluxus.interfaces.cli.main:app"

[project.optional-dependencies]
sql = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9"]
api = ["httpx>=0.27"]
xml = ["lxml>=5.0", "xmltodict>0.15.0"]
docx = ["python-docx>=1.2.0"]
xlsx = ["openpyxl>=3.1.5"]
pdf = ["pypdf>=6.0"]
cli = ["typer>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]