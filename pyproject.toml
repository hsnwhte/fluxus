[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxus"
version = "0.3.0"
description = "Generic, plugin-based ETL & data sync engine."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
fluxus = "fluxus.interfaces.cli.main:app"

[project.optional-dependencies]
sql = ["sqlalchemy>=2.0"]
api = ["httpx>=0.27"]
xml = ["lxml>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]